version: "3.9"

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  rag-net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  chroma-data:
  uploads-data:
  redis-data:

services:
  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIR: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads
      HF_HOME: /app/data/hf_cache
      SENTENCE_TRANSFORMERS_HOME: /app/data/hf_cache
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/app/data/chroma
      - uploads-data:/app/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rag-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # allow time for model downloads on first run

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: rag-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rag-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB Standalone (optional — comment out to use embedded mode) ───────
